<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neko Pix - Skins</title>
    <link rel="stylesheet" href="./css/home.css" />
    <script src="./index.js/index.js" defer></script>
  </head>
  <body>
    <header class="header">
      <h1 class="logo-text">Neko Pix</h1>
      <img src="./img/logo nekopix.png" alt="Logo Neko Pix" class="logo-img" />
    </header>

    <main>
      <section class="game" id="pokemon">
        <h2>POKÉMON</h2>
        <div class="skins-container">
          <div class="skin">
            <img src="./img/724-costumeparty.png" alt="Costume Party" class="pokemon" />
            <h3>Costume Party</h3>
          </div>
          <div class="skin">
            <img src="./img/724-ninja.png" alt="Ninja" class="pokemon" />
            <h3>Ninja</h3>
          </div>
          <div class="skin">
            <img src="./img/724-starcloak.png" alt="Star Cloak" class="pokemon" />
            <h3>Star Cloak</h3>
          </div>
          <div class="skin">
            <img src="./img/724-tuxedo.png" alt="Tuxedo" class="pokemon" />
            <h3>Tuxedo</h3>
          </div>
          <div class="skin">
            <img src="./img/724-starcloaklightblue.png" alt="Star Cloak Light Blue" class="pokemon" />
            <h3>Star Cloak - Light Blue</h3>
          </div>
        </div>
      </section>
      <section class="game" id="palworld">
        <h2>PALWORLD</h2>
        <div class="skins-container">
          <div class="skin">
            <img src="./img/fortune-bringer-lyleen-noct.webp" alt="Fortune Bringer NOCT" />
            <h3>Fortune Bringer - NOCT</h3>
          </div>
          <div class="skin">
            <img src="./img/fortune-bringer-lyleen.webp" alt="Fortune Bringer" />
            <h3>Fortune Bringer</h3>
          </div>
          <div class="skin">
            <img src="./img/lion-dancer-chillet-ignis.webp" alt="Lion Dancer Ignis" />
            <h3>Lion Dancer - Ignis</h3>
          </div>
          <div class="skin">
            <img src="./img/lion-dancer-chillet.webp" alt="Lion Dancer" />
            <h3>Lion Dancer</h3>
          </div>
          <div class="skin">
            <img src="./img/lucky-cattiva.webp" alt="Lucky Cattiva" />
            <h3>Lucky Cattiva</h3>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; Neko Pix - Sophia Angelina Silveira.</p>
    </footer>
  </body>
</html>
